services:
  hue-exporter:
    image: ghcr.io/hypercat-net/hue-exporter:latest
    container_name: hue-exporter
    command:
      - --config.file=/data/hue_exporter.yml
      - --web.listen-address=:9366
    volumes:
      # Single mounted YAML: user-managed settings plus exporter-managed state.
      - ./hue_exporter.yml:/data/hue_exporter.yml
    ports:
      - "9366:9366"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - /hue-exporter
        - --healthcheck.target=http://127.0.0.1:9366/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
