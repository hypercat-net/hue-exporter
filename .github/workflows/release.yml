name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Use a token that can push back to main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes (this tag only)
        id: cliff_notes
        run: |
          git-cliff --current --strip header > /tmp/release-notes.md
          echo "notes<<CLIFF_EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/release-notes.md >> "$GITHUB_OUTPUT"
          echo "CLIFF_EOF" >> "$GITHUB_OUTPUT"

      - name: Regenerate full CHANGELOG.md
        run: git-cliff --output CHANGELOG.md

      - name: Commit updated CHANGELOG.md to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add CHANGELOG.md
          # Only commit when the file actually changed
          git diff --cached --quiet || \
            git commit -m "chore(release): update CHANGELOG.md for ${{ github.ref_name }}"
          git push origin main

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.cliff_notes.outputs.notes }}
