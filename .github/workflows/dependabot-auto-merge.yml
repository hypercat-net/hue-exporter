name: Dependabot auto-merge

# Automatically merge Dependabot PRs for patch and minor updates once all
# required status checks pass.  Major version bumps are intentionally excluded
# because they may contain breaking changes that need human review.
#
# Prerequisites (one-time repository setup):
#   1. Enable "Allow auto-merge" in Settings → General → Pull Requests.
#   2. Protect `main` with a branch-protection rule that:
#      - disables direct pushes
#      - requires at least one approving review
#      - requires these status checks:
#        * "CI / Build and test"
#        * "Build and push Docker image / Build multi-platform image"
#      Auto-merge will only complete when all required checks pass.

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge patch/minor Dependabot PRs
    runs-on: ubuntu-latest
    # Only run for Dependabot-authored PRs.
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve and enable auto-merge for patch/minor updates
        # Skip major updates — they require a human decision.
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
